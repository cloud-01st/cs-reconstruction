# 实验默认配置（各脚本可通过 --config 覆盖）
# 注意：数据口径类参数（block、test_size）与 README 第 4 节一致，不要随意改动

data:
  train_npy: data/processed/bsds300_train.npy   # BSDS500 train+val 的 33x33 块
  set11_dir: data/Set11                          # 测试集目录（11 张 tif）
  test_size: 256                                 # 测试图 resize 尺寸

sampling:
  rates: [0.10, 0.25, 0.50]    # 三档采样率（M/1089）
  seed: 0                       # 测量矩阵固定种子

model:
  name: ours                    # reconnet | ours（阶段 2/3 实现）
  base_channels: 64
  num_res_blocks: 8

train:
  batch_size: 16                # RTX 3060 6GB 建议 16-32
  epochs: 200
  lr: 1.0e-4
  amp: true                     # 混合精度（省约 40% 显存）
  num_workers: 4
  seed: 0

test:
  metrics: [psnr, ssim]

# 传统算法参数（经预实验确定，见 results/baseline_config.json）
classical:
  omp_sparsity: null            # null = 自动 max(15, M//8)
  ista_lam: 0.01                # L1 正则（预实验最优）
  ista_iters: 1000              # FISTA 加速下 1000 次即收敛
  ista_fista: true              # FISTA 动量加速（实测快 ~9 倍）
